<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Digital Signage UTD</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="top-header">
  <div class="left">
    <img src="assets/logo.png" class="logo">
  </div>

  <div class="center">
    <h1>Universitas Teknologi Digital</h1>
  </div>

  <div class="right clock-box">
    <div id="clock">00:00:00</div>
    <div id="date">Senin, 1 Januari 2026</div>
  </div>
</header>

<main>
  <video id="videoPlayer" autoplay loop controls>
    <source src="assets/video.mp4" type="video/mp4">
  </video>
</main>

<footer>
  <marquee>Selamat datang di Universitas Teknologi Digital | Kampus Teknologi Masa Depan</marquee>
</footer>

<script src="script.js"></script>
</body>
</html>
